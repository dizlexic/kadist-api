<!DOCTYPE html>
<html lang="en">

<!-- simple ui -->

<head>
  <title>{{title}}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">

  <style>
    .wrapper {
      display: grid;
      height: 100vh;
      place-items: center
    }
  </style>

</head>

<body>

  <nav class="px-6 py-2 bg-white shadow-md md:flex ">
    <div class="flex justify-between items-center">
      <div class="text-3xl text-gray-800 font-bold hover:text-gray-800">
        <a href="/ui">{{title}}</a>
      </div>
      <div class="md:hidden">
        <button type="button" class="block text-gray-900 hover:text-gray-700 focus:text-gray-700 focus:outline-none">
          <svg class="h-6 w-6 fill-current" viewBox="0 0 24 24">
            <path d="M4 5h16a1 1 0 0 1 0 2H4a1 1 0 1 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2z" />
          </svg>
        </button>
      </div>
    </div>
    <div class="w-full pb-2 md:flex md:items-center md:justify-between md:pb-0">
      <div class="flex flex-col px-2 md:flex-row">
        <a href="/ui" class="py-2 px-2 text-gray-800 rounded hover:bg-gray-900 hover:text-gray-100 hover:font-medium md:mx-2">Home</a>
        <a href="/admin" class="py-2 px-2 text-gray-800 rounded hover:bg-gray-900 hover:text-gray-100 hover:font-medium md:mx-2">Admin</a>
      </div>
      <div class=" flex item-center">
        <form action="/ui">

          <input type="text" name="q" class="w-full px-4 py-3 mx-4 leading-tight text-sm text-gray-400 bg-gray-900 rounded placeholder-gray-200 focus:outline-none focus:shadow-outline" placeholder="search">
          <button type="submit" class="hidden text-gray-900 hover:text-gray-700 md:block">

          </button>
        </form>
      </div>
    </div>
  </nav>

  <div class="p-10 grid grid-cols-1 sm:grid-cols-1 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-3 gap-5">

    {% for video in videos %}
    <div class="rounded overflow-hidden shadow-lg">
      <img class="object-cover origin-center h-40 w-full hover:opacity-85 transition ease-in-out duration-150 hover:scale-105 transform" src="{{video['image_url']}}" width="video['width']" height="video['height']" alt="{{video['title']}}">
      <div class="px-6 py-4">
        <div class="font-bold text-lg mb-2">{{video['title']|safe}}</div>
        <p class="text-gray-700 text-base">
          {{video['abbreviated_description']|safe}}
        </p>
      </div>
      <div class="px-6 pt-4 pb-2">
        {% for tag in video['tags'] %}
        <a href="/ui?q={{tag}}">
          <span class="inline-block bg-gray-200 rounded-full px-3 py-1 text-xs text-gray-700 mr-2 mb-2">{{tag}}</span>
        </a>
        {% endfor %}
      </div>
    </div>
    {% endfor %}

  </div>

</body>

</html>
